services:
  db:
    image: postgres:16-alpine
    container_name: pants_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pants_db}
      POSTGRES_USER: ${POSTGRES_USER:-pants_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pants_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pants_user} -d ${POSTGRES_DB:-pants_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pants_django_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DATABASE_URL: postgres://${POSTGRES_USER:-pants_user}:${POSTGRES_PASSWORD:-pants_password}@db:5432/${POSTGRES_DB:-pants_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
